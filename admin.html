<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — ПродвижениеПро</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">⬡</span>
      <span>ПродвижениеПро</span>
    </div>
    <h2 class="login-title">Панель управления</h2>
    <form id="loginForm">
      <div class="login-group">
        <input type="text" id="loginUser" placeholder="Логин" class="login-input" required>
      </div>
      <div class="login-group">
        <input type="password" id="loginPass" placeholder="Пароль" class="login-input" required>
      </div>
      <button type="submit" class="login-btn">Войти</button>
      <div id="loginError" class="login-error hidden">Неверный логин или пароль</div>
    </form>
    <a href="/" class="login-back">← На сайт</a>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel hidden" id="adminPanel">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⬡</span>
      <span>ПродвижениеПро</span>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-link active" data-tab="orders">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Заявки
      </button>
      <button class="sidebar-link" data-tab="customers">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Клиенты
      </button>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </button>
      <a href="/" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        На сайт
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <button class="sidebar-toggle" id="sidebarToggle">
          <span></span><span></span><span></span>
        </button>
        <h1 class="admin-page-title" id="pageTitle">Заявки</h1>
      </div>
      <div class="admin-header-right">
        <span class="admin-user" id="adminUsername">admin</span>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-card-val" id="statTotal">—</div>
        <div class="stat-card-key">Всего заявок</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-val accent" id="statNew">—</div>
        <div class="stat-card-key">Новые</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-val" id="statProcess">—</div>
        <div class="stat-card-key">В работе</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-val" id="statCustomers">—</div>
        <div class="stat-card-key">Клиентов</div>
      </div>
    </div>

    <!-- ORDERS TAB -->
    <div class="tab-content active" id="tab-orders">
      <div class="tab-toolbar">
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-status="all">Все</button>
          <button class="filter-tab" data-status="new">Новые</button>
          <button class="filter-tab" data-status="processing">В работе</button>
          <button class="filter-tab" data-status="completed">Выполнены</button>
          <button class="filter-tab" data-status="cancelled">Отменены</button>
        </div>
        <button class="export-btn" id="exportBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
      </div>
      <div class="table-wrap">
        <table class="admin-table" id="ordersTable">
          <thead>
            <tr>
              <th>ID</th><th>Имя</th><th>Телефон</th><th>Email</th>
              <th>Услуга</th><th>Бюджет</th><th>Статус</th><th>Дата</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="8" class="table-loading">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- CUSTOMERS TAB -->
    <div class="tab-content" id="tab-customers">
      <div class="table-wrap">
        <table class="admin-table" id="customersTable">
          <thead>
            <tr>
              <th>Имя</th><th>Телефон</th><th>Email</th>
              <th>Заявок</th><th>Первая заявка</th><th>Последняя</th>
            </tr>
          </thead>
          <tbody id="customersBody">
            <tr><td colspan="6" class="table-loading">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
